      - id: report-stats-open
        path: v930/report-stats-open.jpeg
        original_name: "930版本-性能调优_打开报告统计.jpeg"
        scenes: [report-stats, aside]
        components: [StatsAside, StatsSummaryPanel, RooflinePanel, CsvFieldListPanel]
      - id: report-stats-scrolled
        path: v930/report-stats-scrolled.jpeg
