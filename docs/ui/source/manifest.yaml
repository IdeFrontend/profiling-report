# Layer A — full-frame design dumps (append-only batches)
# Stable id: {batchId}/{scene}  e.g. v930/entry

batches:
  v930:
    label: "930 性能调优"
    files:
      - id: entry
        path: v930/entry.jpeg
        original_name: "930版本-性能调优_入口.jpeg"
        scenes: [entry, toolbar, overview, gutter, swimlane]
