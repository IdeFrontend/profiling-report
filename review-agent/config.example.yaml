# review-agent configuration
# Copy to ~/.config/review-agent/config.yaml
# Override location: --config flag or REVIEW_AGENT_CONFIG env var

# --- GitHub credentials ---
github:
  # Personal Access Token (fine-grained recommended).
  # Required scopes: Pull requests (R/W), Contents (R).
  # Env override: GITHUB_TOKEN (takes precedence).
  token: ""

  # Optional: only review PRs in these repos.
  # Empty list = all repos the token can access.
  repos: []
  #   - "owner/repo-a"
  #   - "owner/repo-b"

  # Who to poll for in gh search (default: @me = the token owner).
  reviewer: "@me"

# --- Webhook mode ---
# Receives push events from GitHub via POST /hook.
# Requires a tunnel (ngrok/cloudflared/smee) to expose the port.
webhook:
  enabled: false                        # set true to enable webhook listener
  port: 8080                            # listen port
  host: "0.0.0.0"                       # bind address
  # HMAC-SHA256 secret for signature validation.
  # Must match the secret configured in GitHub webhook settings.
  # Env override: WEBHOOK_SECRET (takes precedence).
  secret: ""

# --- Polling mode ---
# Uses `gh search prs --review-requested=@me` to discover pending reviews.
# Requires gh CLI installed and authenticated (gh auth login).
polling:
  enabled: true                         # set false to disable polling
  interval_seconds: 120                 # seconds between polls (min: 30 recommended)

# --- AI agent for review ---
# Selects which local agent performs the code review.
# Available adapters: claude-code, hermes, opencode, generic
agent:
  name: "claude-code"                   # adapter name (see below for per-adapter config)
  timeout_seconds: 300                  # max seconds to wait for agent response

  # --- Per-adapter config (only the selected adapter's section is used) ---

  # Claude Code CLI (name: "claude-code")
  # claude_code:
  #   binary: "claude"                  # path to claude CLI
  #   model: ""                         # optional model override (e.g. "claude-sonnet-4-20250514")
  #   max_tokens: 8192

  # Hermes CLI (name: "hermes")
  # hermes:
  #   binary: "hermes"                  # path to hermes CLI
  #   profile: "reviewer"              # hermes profile to use

  # OpenCode CLI (name: "opencode")
  # opencode:
  #   binary: "opencode"               # path to opencode CLI

  # Generic / custom command (name: "generic")
  # Placeholders: {prompt_file} {diff_file} {context_file} {output_file}
  # generic:
  #   command: "python my_reviewer.py --prompt {prompt_file} --output {output_file}"

# --- Review behavior ---
review:
  auto_approve: false                   # reserved: auto-submit APPROVE verdicts
  max_diff_size: 100000                 # skip PRs with diffs larger than this (chars)
  skip_drafts: true                     # skip PRs whose body starts with [WIP]
  prompt_prefix: ""                     # custom text prepended to the review prompt

# --- Dedup state ---
# Tracks which PRs have already been reviewed to avoid duplicate reviews.
state:
  path: "~/.config/review-agent/seen.json"
  prune_days: 30                        # auto-remove entries older than N days

# --- Logging ---
logging:
  level: "INFO"                         # DEBUG | INFO | WARNING | ERROR
  file: "~/.config/review-agent/logs/review-agent.log"
  max_bytes: 10485760                   # max log file size before rotation (10 MB)
  backup_count: 5                       # number of rotated log files to keep
